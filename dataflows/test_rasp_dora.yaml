nodes:
  - id: bno_sensor
    _unstable_deploy:
      machine: rpi    
    build: cargo build -p bno_sensor --target=aarch64-unknown-linux-gnu
    path: /workspace/sftp/bno_sensor
    env:
      DEBUG: true
    inputs:
      tick: dora/timer/millis/100
    outputs:
      - imu_data
    
  - id: input
    _unstable_deploy:
      machine: pc
    build: cargo build -p input
    path: ../../target/debug/input
    inputs:
      input_test: bno_sensor/imu_data

