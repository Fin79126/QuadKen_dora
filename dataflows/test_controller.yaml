nodes:
  - id: controller_rx
    build: cargo build -p controller_rx
    path: ../target/debug/controller_rx
    inputs:
      tick: dora/timer/millis/100
    outputs:
      - status
    
  - id: input
    build: cargo build -p input
    path: ../target/debug/input
    inputs:
      input_test: controller_rx/status

